[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ncm-benchmarks"
version = "2.0.0"
description = "Production benchmarks, hierarchical concept decoder, and sovereign inference engine for Next-Concept Modeling"
readme = "README.md"
authors = [
    { name = "Hardonian Labs", email = "scottrmhardie@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.51.0",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.0",
    "huggingface-hub>=0.20.0",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.4.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0"
]

[project.scripts]
ncm-bench = "ncm_bench.cli:main"

[tool.setuptools.packages.find]
include = ["ncm_bench*", "service*"]

