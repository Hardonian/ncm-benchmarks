name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-security-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies and editable package
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx ruff bandit
          pip install --no-deps -e .

      - name: Clone and patch upstream NCM
        run: |
          git clone https://github.com/HazyResearch/ncm.git ncm
          git -C ncm checkout c70274273f489abc73832b2b98584a8483b6b203
          git -C ncm apply ../patches/device-support.patch

      - name: CLI entrypoint sanity check
        run: ncm-bench --help

      - name: Lint with ruff
        run: ruff check ncm_bench ncm_train service scripts tests

      - name: Security scan with bandit
        run: bandit -r ncm_bench ncm_train service scripts -x scripts/as-run -ll

      - name: Run test suite with coverage gate
        run: python -m pytest -v --cov=ncm_bench --cov=ncm_train --cov=service --cov-report=term-missing --cov-fail-under=70 tests
