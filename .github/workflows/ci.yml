name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install requests pytest httpx ruff bandit

      - name: Lint with ruff
        run: ruff check ncm_bench service scripts tests

      - name: Security scan with bandit
        run: bandit -r ncm_bench service scripts -x scripts/as-run -ll

      - name: Run test suite
        run: pytest -v tests

