apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ncm-summarizer
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: ncm-summarizer
  template:
    metadata:
      labels:
        app: ncm-summarizer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: ncm-summarizer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8031
          env:
            - name: NCM_DEVICE
              value: {{ .Values.env.NCM_DEVICE | quote }}
            - name: OMP_NUM_THREADS
              value: {{ .Values.env.OMP_NUM_THREADS | quote }}
            - name: NCM_STRICT_CHECKSUMS
              value: {{ .Values.env.NCM_STRICT_CHECKSUMS | quote }}
            - name: NCM_STRICT_AUTH
              value: {{ .Values.env.NCM_STRICT_AUTH | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health
              port: 8031
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8031
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: artifacts
              mountPath: /app/artifacts
              readOnly: true
            - name: hf-home
              mountPath: /app/hf-home
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: artifacts
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-artifacts
        - name: hf-home
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-hf-home
