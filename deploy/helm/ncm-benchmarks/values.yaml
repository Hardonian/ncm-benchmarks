replicaCount: 2
image:
  repository: ghcr.io/hardonian/ncm-benchmarks
  tag: "3.0.0"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8031
args:
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8031"
  - "--quantize"
  - "int8"
resources:
  requests:
    cpu: "2"
    memory: "2Gi"
  limits:
    cpu: "8"
    memory: "4Gi"
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
probes:
  readinessPath: /ready
  livenessPath: /health
env:
  HF_HUB_OFFLINE: "1"
networkPolicy:
  denyAllEgress: true
