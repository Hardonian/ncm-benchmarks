apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ncm-benchmarks
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: ncm-benchmarks
  template:
    metadata:
      labels:
        app: ncm-benchmarks
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: ncm-benchmarks
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.args }}
          args:
            {{- toYaml .Values.args | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: {{ .Values.service.port }}
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: {{ .Values.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: artifacts
              mountPath: /app/artifacts
              readOnly: true
            - name: hf-home
              mountPath: /app/hf-home
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: artifacts
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-artifacts
        - name: hf-home
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-hf-home
