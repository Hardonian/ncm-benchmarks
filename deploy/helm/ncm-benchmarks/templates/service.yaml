apiVersion: v1
kind: Service
metadata:
  name: ncm-benchmarks
  labels:
    app: ncm-benchmarks
spec:
  type: {{ .Values.service.type }}
  selector:
    app: ncm-benchmarks
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
