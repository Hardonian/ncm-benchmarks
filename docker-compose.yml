services:
  ncm-sovereign-summarizer:
    build:
      context: .
      dockerfile: Dockerfile
    image: hardonian/ncm-sovereign-summarizer:2.0.0
    container_name: ncm-summarizer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8031:8031"
    environment:
      - NCM_DEVICE=cpu
      - OMP_NUM_THREADS=8
      - NCM_API_KEY=${NCM_API_KEY:-}
      - NCM_STRICT_CHECKSUMS=1
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./hf-home:/app/hf-home:ro
      - ./SHA256SUMS:/app/SHA256SUMS:ro
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8031/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
